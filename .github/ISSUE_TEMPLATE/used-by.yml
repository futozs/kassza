name: Használom a kasszát
description: Add hozzá a projekted a README "Ki használja?" listájához
title: 'Használom: '
labels: [used-by]
body:
  - type: markdown
    attributes:
      value: |
        Köszönjük, hogy használod! A listára csak az kerül fel, amit itt megadsz, és bármikor kérheted az eltávolítását.
  - type: input
    id: name
    attributes:
      label: Projekt vagy cég neve
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Weboldal vagy GitHub repó
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Hol fut a kassza?
      options:
        - Élesben
        - Tesztelem, még nem éles
        - Hobbi vagy kísérlet
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Mire használod? (opcionális)
      description: Például webshop, SaaS előfizetés, belső rendszer, Stripe webhook nyugtázás.
