name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths-ignore: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm ci
      - name: Csomag-aláírások és provenance ellenőrzése
        if: matrix.node == 24
        run: npm audit signatures
      - run: npm run xsd:fetch
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run readme:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run size
      - run: npm run check:package

  runtimes:
    name: Futtatókörnyezetek (Bun, Deno, Cloudflare workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build
      - name: Node.js (ESM és CommonJS)
        run: node scripts/smoke.mjs
      - name: Bun
        run: bun scripts/smoke.mjs
      - name: Deno
        run: deno run --allow-read scripts/smoke.mjs
      - name: Cloudflare workerd (Miniflare)
        run: |
          npm install --no-save --no-audit --no-fund miniflare@4
          node scripts/smoke-workerd.mjs

  commitlint:
    name: Commit üzenetek (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Pull request címe
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commitlint.mjs --message "$TITLE"
      - name: Pull request commitjai
        if: github.event_name == 'pull_request'
        run: node scripts/commitlint.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Pusholt commitok
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/commitlint.mjs --range "${{ github.event.before }}..${{ github.sha }}"
