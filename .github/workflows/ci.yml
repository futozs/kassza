name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths-ignore: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: npm ci
      - run: npm run xsd:fetch
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run readme:check
      - run: npm run test:coverage
      - name: Élő tesztfiók smoke teszt
        if: matrix.node == 24 && github.event_name == 'push'
        env:
          SZAMLAZZ_TEST_AGENT_KEY: ${{ secrets.SZAMLAZZ_TEST_AGENT_KEY }}
        run: npx vitest run tests/live.test.ts
      - run: npm run build
      - run: npm run check:package
