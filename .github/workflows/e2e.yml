name: E2E

on:
  workflow_call:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'futozs/kassza'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Élő e2e a Számlázz.hu tesztfiókján
        env:
          SZAMLAZZ_TEST_AGENT_KEY: ${{ secrets.SZAMLAZZ_TEST_AGENT_KEY }}
          SZAMLAZZ_E2E_EMAIL: ${{ secrets.SZAMLAZZ_E2E_EMAIL }}
          SZAMLAZZ_E2E_RECEIPT_PREFIX: ${{ vars.SZAMLAZZ_E2E_RECEIPT_PREFIX }}
          SZAMLAZZ_E2E_TAXPAYER: ${{ vars.SZAMLAZZ_E2E_TAXPAYER }}
        run: npm run e2e
