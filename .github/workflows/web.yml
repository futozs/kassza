name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: export
      NEXT_PUBLIC_BASE_PATH: /kassza
      NEXT_PUBLIC_SITE_URL: https://futozs.github.io/kassza
    defaults:
      run:
        working-directory: web
    steps:
      - name: Repó kiolvasása
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js beállítása
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test

      - name: Build
        run: npm run build

      - name: Pages artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: GitHub Pages telepítése
        id: deployment
        uses: actions/deploy-pages@v4
