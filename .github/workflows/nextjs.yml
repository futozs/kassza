name: Next.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Repó kiolvasása
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js beállítása
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test

      - name: Vercel secret-ek ellenőrzése
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Vercel projekt összekapcsolása
        run: npx vercel@latest link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Natív Next.js SSR build
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Next.js SSR deploy
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"