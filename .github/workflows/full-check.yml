name: Teljes ellenőrzés

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (Node 22, 24, 26, futtatókörnyezetek, szigorú XSD)
    uses: ./.github/workflows/ci.yml

  drift:
    name: Változásfigyelő (Számlázz.hu XSD-k, hibakódok, IPN IP-k, NAV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Eltérés a rögzített állapothoz képest
        run: node scripts/drift.mjs

  e2e:
    name: Élő e2e a Számlázz.hu tesztfiókján
    needs: ci
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
