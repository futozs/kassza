name: Teljes ellenőrzés

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (Node 22, 24, 26, futtatókörnyezetek, szigorú XSD)
    uses: ./.github/workflows/ci.yml

  drift:
    name: Változásfigyelő (Számlázz.hu XSD-k, hibakódok, IPN IP-k, NAV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Eltérés a rögzített állapothoz képest
        run: node scripts/drift.mjs

  e2e:
    name: Élő e2e a Számlázz.hu tesztfiókján
    needs: ci
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
