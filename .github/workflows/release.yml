name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
    inputs:
      bump:
        description: Kényszerített verziólépés (auto esetén a commitokból számolja)
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.repository == 'futozs/kassza' &&
      !startsWith(github.event.head_commit.message, 'release:') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Repó kiolvasása
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js beállítása
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: npm frissítése (Trusted Publishing >=11.5.1-et igényel)
        run: npm install -g npm@11

      - name: Bun beállítása (a web/bun.lock frissítéséhez)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Git szerző beállítása
        run: |
          git config user.name "futozs"
          git config user.email "zsombi.futo@gmail.com"

      - name: Függőségek telepítése
        run: npm ci

      - name: XSD sémák letöltése
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
          npm run xsd:fetch

      - name: Kiadás (lint, típusellenőrzés, teszt, build, verziólépés, publish, tag, push)
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$BUMP" ] && [ "$BUMP" != "auto" ]; then
            npm run release:ci -- "$BUMP"
          else
            npm run release:ci
          fi
